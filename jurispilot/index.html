<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09172f"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><title>JurisPilot</title><style>html,body{margin:0;min-height:100%;background:#09172f;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:white}.boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.mark{width:82px;height:82px;margin:auto;border-radius:24px;background:#d8b064;display:grid;place-items:center;font-size:42px;color:#09172f}.boot h1{margin:18px 0 6px}.boot p{opacity:.75;line-height:1.5;font-size:13px}</style></head><body><div class="boot"><div><div class="mark">⚖</div><h1>JurisPilot</h1><p>Chargement de votre application juridique…</p></div></div><script>(async()=>{try{const r=await fetch('../app/src/main/assets/v3.html',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);let h=await r.text();h=h.replace('</head>','<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"></head>');h=h.replace('</body>',`<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}document.addEventListener('click',function(e){const a=e.target.closest('a[href]');if(a&&/^https?:/i.test(a.href)&&new URL(a.href).hostname!==location.hostname){a.target='_blank';a.rel='noopener';}});<\/script></body>`);document.open();document.write(h);document.close();}catch(e){document.body.innerHTML='<div class="boot"><div><div class="mark">⚖</div><h1>JurisPilot</h1><p>Impossible de charger l’application. Vérifiez votre connexion puis réessayez.</p></div></div>';}})();</script></body></html>
