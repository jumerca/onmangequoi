name: Publish JurisPilot PWA

on:
  push:
    branches: [jurispilot-build]
    paths:
      - 'jurispilot/**'
      - '.github/workflows/jurispilot-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: jurispilot-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout JurisPilot branch
        uses: actions/checkout@v6
        with:
          ref: jurispilot-build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload JurisPilot site
        uses: actions/upload-pages-artifact@v4
        with:
          path: jurispilot
      - name: Deploy JurisPilot
        id: deployment
        uses: actions/deploy-pages@v4
